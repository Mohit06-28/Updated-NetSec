<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Network Scanner</title>
<meta name="description" content="Login to your Network Scanner account to run free online port scans and network security assessments.">
<link rel="canonical" href="https://YOUR-DOMAIN.vercel.app/login">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;font-family:'Segoe UI',sans-serif;display:flex;align-items:center}
.login-card{max-width:420px;width:100%;margin:20px auto;background:#fff;border-radius:20px;padding:38px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.form-control{border-radius:10px;padding:12px 15px}
.form-control:focus{border-color:#667eea;box-shadow:0 0 0 .2rem rgba(102,126,234,.25)}
.btn-login{background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:10px;padding:12px;font-weight:600;color:#fff;width:100%}
.btn-login:hover{color:#fff;opacity:.95}
#msg{display:none}
</style>
</head>
<body>
<div class="container">
  <div class="login-card">
    <div class="text-center mb-4">
      <i class="fas fa-shield-alt fa-3x" style="color:#667eea"></i>
      <h3 class="mt-3">Welcome Back</h3>
      <p class="text-muted">Login to Network Scanner</p>
    </div>
    <div class="alert alert-danger" id="msg"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label"><i class="fas fa-user"></i> Email or Phone</label>
        <input type="text" class="form-control" id="identifier" placeholder="you@example.com or +15551234567" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="fas fa-lock"></i> Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" required autocomplete="current-password">
          <button type="button" class="btn btn-outline-secondary" id="t1"><i class="far fa-eye" id="i1"></i></button>
        </div>
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="remember">
        <label class="form-check-label">Remember me</label>
      </div>
      <button type="submit" class="btn-login" id="submitBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
    </form>
    <hr class="my-4">
    <p class="text-center mb-0">Don't have an account? <a href="/register">Create one free</a></p>
  </div>
</div>
<script>
  const $=id=>document.getElementById(id);
  $('t1').onclick=()=>{const i=$('password'),ic=$('i1');if(i.type==='password'){i.type='text';ic.className='far fa-eye-slash';}else{i.type='password';ic.className='far fa-eye';}};
  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault(); $('msg').style.display='none';
    const btn=$('submitBtn'),orig=btn.innerHTML; btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Logging in...';
    try{
      const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',
        body:JSON.stringify({identifier:$('identifier').value.trim(),password:$('password').value})});
      const d=await r.json();
      if(d.success) window.location.href=d.redirect||'/dashboard';
      else{ $('msg').textContent=d.error||'Login failed'; $('msg').style.display='block'; }
    }catch(err){ $('msg').textContent='Network error'; $('msg').style.display='block'; }
    finally{ btn.disabled=false; btn.innerHTML=orig; }
  });
</script>
</body>
</html>
